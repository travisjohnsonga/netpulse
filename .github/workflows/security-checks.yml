name: Security checks

# Security guards for the backend, run without the full stack:
#  - exception-exposure: dependency-free AST guard (also in the pytest suite
#    tests/test_security.py::TestNoExceptionExposure and the pre-commit hook).
#  - python-security-scan: pip-audit (dependency CVEs, BLOCKING) + bandit (static
#    security lint, BLOCKING at medium+ severity — every High/Medium finding is
#    fixed or carries an inline justified `# nosec`).

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'scripts/check_exception_exposure.py'
      - '.github/workflows/security-checks.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'scripts/check_exception_exposure.py'
      - '.github/workflows/security-checks.yml'

permissions:
  contents: read

jobs:
  exception-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: No exception detail in API responses (CWE-209)
        run: python3 scripts/check_exception_exposure.py

  python-security-scan:
    # Dependency CVE audit + static security linting for the Django backend.
    # Tool versions are pinned so a tool-side change can't silently alter the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install scanners (pinned)
        run: python -m pip install --upgrade "pip-audit==2.9.0" "bandit==1.8.6"

      # BLOCKING: a newly-disclosed CVE in a pinned dependency fails the build
      # so it gets triaged, not ignored. (PYSEC-2026-1325/ecdsa was briefly a
      # candidate for --ignore-vuln, but its sole dependent — python-jose —
      # turned out to be a DEAD requirement and was removed instead.)
      #
      # Ignores — each triaged as NOT APPLICABLE to spane, with no fix reachable
      # without disproportionate churn. Revisit when the noted condition changes;
      # remove the entry once a fixed version is adopted.
      #  - social-auth-core 4.9.1 (triaged 2026-10-17). Every advisory is
      #    backend- or feature-specific; spane's AUTHENTICATION_BACKENDS are
      #    Google / Azure AD / Okta / GitHub only, and SOCIAL_AUTH_PIPELINE has
      #    no partial steps:
      #      GHSA-526j-582w-7fm9  LINE backend login CSRF          (no LINE)
      #      PYSEC-2026-4167      SAML response not bound to request (no SAML
      #                           backend registered — MUST upgrade before the
      #                           planned SAML SSO stage ships)
      #      PYSEC-2026-4169      LoginRadius backend login CSRF    (not used)
      #      PYSEC-2026-4165      vk-app unsigned callback          (not used)
      #      PYSEC-2026-4166      Vend user_id collision            (not used)
      #      PYSEC-2026-4168      partial-pipeline token not session-bound
      #                           (no partial pipeline steps)
      #    Fixes need core >=5.0 / 5.0.2, which social-auth-app-django 5.9 caps
      #    at <5.0; the newest app-django (7.1) needs core 6.x — a double-major
      #    SSO upgrade. Revisit with that upgrade or before adding SAML.
      #  - GHSA-8pqf-f4m5-798g (Twisted <=26.4.0, triaged 2026-10-17): ReDoS in
      #    twisted.mail IMAP wildcardToRegexp. Twisted is pulled in by daphne
      #    (websockets); spane never uses Twisted's IMAP. No fixed release yet —
      #    drop this ignore when one ships.
      - name: pip-audit (services/api dependencies)
        run: >-
          pip-audit -r services/api/requirements.txt --progress-spinner off
          --ignore-vuln GHSA-526j-582w-7fm9
          --ignore-vuln PYSEC-2026-4165
          --ignore-vuln PYSEC-2026-4166
          --ignore-vuln PYSEC-2026-4167
          --ignore-vuln PYSEC-2026-4168
          --ignore-vuln PYSEC-2026-4169
          --ignore-vuln GHSA-8pqf-f4m5-798g

      # BLOCKING at medium+ severity. Every High/Medium finding in
      # services/api/apps has been triaged: each is either fixed or carries an
      # inline `# nosec <id> — <justification>` (B310 urlopen guarded by
      # net_safety.validate_outbound_url; B501 verify=False on internal-only
      # OpenSearch; B601 paramiko exec_command with a constant command).
      # The grandfathering baseline is removed, so the suppressions are explicit
      # in code, not hidden in a file, and any NEW medium+ finding fails the build.
      #
      # --skip B507 (paramiko AutoAddPolicy: missing SSH host-key validation) is
      # an explicit ACCEPTED RISK, not a silenced warning:
      #   * spane collects config from multi-vendor network devices (switch/
      #     router/firewall) over SSH. Their host keys are NOT pre-provisioned
      #     into a managed known_hosts — distributing/maintaining per-device keys
      #     across a discovery-driven, multi-vendor fleet is operationally
      #     infeasible, and connections target operator-curated inventory devices
      #     reachable only over the trusted, access-controlled management network.
      #   * Residual risk = a first-connection MITM on the management plane. It is
      #     accepted because that plane is trusted/segmented, device credentials
      #     are per-device from OpenBao (not broadly reused), and this matches
      #     standard network-automation tooling (netmiko/Ansible default to
      #     auto-add). Pre-seeding host keys for every device/vendor is not viable
      #     for the platform's model.
      #   * The risk is reviewed/tracked by CodeQL
      #     (py/paramiko-missing-host-key-validation, both instances dismissed
      #     there). It is `--skip`-ped in bandit rather than inline-`# nosec`'d so
      #     the suppression edit doesn't re-fingerprint and re-open that dismissed
      #     CodeQL alert.
      #
      # Low-severity findings (try/except/pass best-effort handlers, "password"-
      # substring string constants that are field names not secrets, parameterized
      # shell-free subprocess) are surfaced by a full `bandit -r services/api/apps`
      # scan but excluded from the gate by the severity threshold as
      # low-risk / false-positive-heavy.
      - name: bandit (services/api/apps, blocking, medium+)
        run: bandit -r services/api/apps --severity-level medium --skip B507
